# Konfigurasi Gitleaks — kkpusid
# Dokumen acuan: REKAPITULASI_AUDIT.md §B1 (secret scanning)
#
# `useDefault = true` mewarisi seluruh aturan bawaan gitleaks (private-key,
# generic-api-key, JWT, dll).

[extend]
useDefault = true

[allowlist]
description = "Allowlist kkpusid — hanya untuk false-positive terverifikasi"

# Template .env.sample tidak memuat nilai asli
paths = [
    '''(^|/)\.env\.(sample|development\.sample|production\.sample)$''',
]
