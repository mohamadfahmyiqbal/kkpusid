<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" href="/assets/icons/pus.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/pus.png" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0d47a1" />
  <meta name="description" content="Koperasi frontend app" />

  <!-- iOS PWA / Add to Home Screen support.
       iOS Safari tidak menghormati "display: standalone" dari manifest,
       sehingga meta apple-mobile-web-app-* diperlukan agar app tampil
       full-screen saat dipasang di home screen. status-bar-style "default"
       dipakai (bukan black-translucent) agar konten tidak tertutup status
       bar pada layar yang belum menerapkan safe-area-inset. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PUS" />
  <!-- Cegah iOS Safari mengubah nomor telepon/ID menjadi tautan otomatis. -->
  <meta name="format-detection" content="telephone=no" />
  
  <!-- Prevent caching of index.html -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <!-- Content Security Policy & Referrer-Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data: blob:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self';" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

  <title>PUS</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
