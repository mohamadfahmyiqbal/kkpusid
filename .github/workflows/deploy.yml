name: CI/CD Vite React to VPS (kkpus.id)

on:
  push:
    branches: [ "master", "main", "rollback/**" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # CI STAGE: Lint, Test, Audit, Security
  # ============================================
  ci:
    name: CI - Lint, Test, Audit, Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for gitleaks

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (ci)
        run: npm ci

      - name: Run ESLint (blocking)
        run: npm run lint

      - name: Run Tests
        run: npm run test:ci
        env:
          NODE_ENV: test

      - name: Secret scan (gitleaks) — B1
        env:
          GITLEAKS_VERSION: '8.18.4'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks detect --source="." --verbose --no-git --config .gitleaks.toml

      - name: Run npm audit (non-blocking - tracked in M5)
        run: |
          echo "⚠️ npm audit results (non-blocking until M5):"
          npm audit --audit-level=high 2>&1 || true

      - name: Upload coverage (if tests pass)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================
  # DEPLOY STAGE: Only on branch push (not PR)
  # ============================================
  deploy:
    name: Deploy to VPS
    needs: ci
    if: github.event_name == 'push' && github.repository == 'mohamadfahmyiqbal/kkpusid'
    runs-on: ubuntu-latest
    environment:
      name: VPS_KKPUSID
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          VITE_API_BASE_URL: https://api.kkpus.id/api
          VITE_API_ORIGIN: https://api.kkpus.id
          VITE_SOCKET_URL: https://api.kkpus.id
        run: npm run build

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add remote host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2222 ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy build to VPS
        run: |
          BRANCH="${GITHUB_REF##*/}"
          echo "Deploying branch: $BRANCH"
          rsync -avz --delete -e "ssh -p 2222" build/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/kkpus.id/

          # Post-deploy verification (static PWA — verify files landed on disk)
          echo "Verifying deployment..."
          ssh -p 2222 -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            DEPLOY_DIR="/var/www/kkpus.id"

            # Primary check: index.html must exist and be non-empty
            if [ -s "$DEPLOY_DIR/index.html" ]; then
              echo "✅ Deploy verified: $DEPLOY_DIR/index.html present ($(wc -c < "$DEPLOY_DIR/index.html") bytes)"
            else
              echo "❌ Deploy verification failed: $DEPLOY_DIR/index.html missing or empty"
              ls -la "$DEPLOY_DIR" 2>/dev/null || echo "Deploy dir does not exist"
              exit 1
            fi

            # Best-effort HTTP check via nginx (vhost-aware; informational, non-fatal)
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: kkpus.id" http://localhost/index.html 2>/dev/null || echo "000")
            echo "ℹ️ nginx HTTP status for kkpus.id/index.html: $HTTP_CODE (non-fatal)"
          EOF

